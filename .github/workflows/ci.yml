name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: TypeScript compile + Lint ──────────────────────────────────────
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Lint (client)
        working-directory: client
        run: |
          npm ci
          npx eslint . --max-warnings=0
        continue-on-error: false

  # ─── Job 2: Unit / Integration Tests ───────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engineering_platform_test
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 7d
      PORT: "5000"
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push --skip-generate

      - name: Run tests
        run: npm test

  # ─── Job 3: Deploy to DigitalOcean ─────────────────────────────────────────
  # Runs only on push to main AFTER typecheck-lint and test pass.
  # Required GitHub Secrets (set in repo Settings → Secrets → Actions):
  #   DO_HOST     — DigitalOcean droplet IP address
  #   DO_USER     — SSH user (e.g. root)
  #   DO_SSH_KEY  — Private SSH key (matching the public key on the droplet)
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [typecheck-lint, test]
    # Only deploy on push to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/engineers-platform

            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Building and restarting containers ---"
            docker compose --env-file .env.production -f docker-compose.prod.yml up --build -d

            echo "--- Pruning unused Docker images ---"
            docker image prune -f

            echo "--- Renewing SSL certificates (if due) ---"
            docker compose -f docker-compose.prod.yml exec -T certbot certbot renew --quiet || true

            echo "--- Deploy complete ---"
