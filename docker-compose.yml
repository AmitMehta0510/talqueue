version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: engineers-platform-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: engineers_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: engineers-platform-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:password@db:5432/engineers_platform?schema=public"
      JWT_SECRET: your_super_secret_jwt_key
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      REDIS_URL: "redis://redis:6379"
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
      - elasticsearch

  redis:
    image: redis:7-alpine
    container_name: engineers-platform-redis
    restart: always
    ports:
      - "6379:6379"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: engineers-platform-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: engineers-platform-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  elasticsearch_data:
