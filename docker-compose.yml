version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: engineers-platform-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: engineers_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: engineers-platform-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:password@db:5432/engineers_platform?schema=public"
      JWT_SECRET: your_super_secret_jwt_key
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: engineers-platform-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
