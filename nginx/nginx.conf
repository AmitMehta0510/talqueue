# ─── Engineers Platform — Nginx Reverse Proxy ─────────────────────────────────
# Handles:
#   • HTTP  (port 80):  ACME challenge for Certbot + redirect to HTTPS
#   • HTTPS (port 443): SSL termination, routes /api/* → server, /* → client
#
# Volume mounts required (see docker-compose.prod.yml):
#   /etc/letsencrypt      ← Let's Encrypt certificates
#   /var/www/certbot      ← Certbot webroot for ACME challenge

# ─── HTTP — redirect + ACME challenge ─────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot webroot — must respond before redirect so Certbot can verify domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS — SSL termination + reverse proxy ──────────────────────────────────
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # ── SSL certificate (Let's Encrypt via Certbot) ────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Modern SSL settings (TLS 1.2 + 1.3 only, strong ciphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Client body size (match server 10mb limit) ─────────────────────────────
    client_max_body_size 11m;

    # ── API — proxy to Node.js server ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO — WebSocket proxy ────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── Client — proxy to Nginx client container ───────────────────────────────
    location / {
        proxy_pass         http://client:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
